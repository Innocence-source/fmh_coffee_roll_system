<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./css/index.css" th:href="@{/static/css/index.css}" type="text/css">
    <title>奇酷</title>
</head>
<body ontouchstart="">
<header class="header">奇酷-注册</header>

<form class="reg-form" autocomplete="off">
	<div class="container">
		<div class="row">
			<label>姓名:</label>
			<input type="text" placeholder="请输入您的姓名" name="name">
		</div>
		
		<div class="row">
			<label>手机号:</label>
			<input type="number" placeholder="请输入您的手机号" name="tel">
		</div>

		<div class="row">
			<label>班级:</label>
			<input type="text" placeholder="请输入您的班级" prop="className" name="className">
		</div>

		<div class="row">
			<label>密码:</label>
			<input type="password" placeholder="请输入密码" prop="password" name="password">
		</div>

		<div class="row">
			<label>确认密码:</label>
			<input type="password" placeholder="请再次输入密码" id="confrim" prop="password2">
		</div>

		<p class="info" prop="roleName">
			<label for="agree-1"><input type="radio" name="role" checked id="agree-1" value="1">学生</label>
			<label for="agree-2"><input type="radio" name="role" id="agree-2" value="2">教师</label>
		</p>

		<button class="btn">注册</button>
	
		<p class="info" style="border-bottom: none;background: transparent;">
			<a class="link ft" href="./login.html">已有账号、立即登录</a>
		</p>
	</div>
</form>

<!-- 引入 layer的 css 样式  -->
<link rel="stylesheet" href="./layer//theme/default/layer.css">

<!-- 引入 layer 脚本 -->
<script src="./js/jquery-3.7.1.min.js"></script>
<script src="./layer/layer.js"></script>

<!-- 引入 axios -->
<script src="./js/axios.min.js"></script>

<script src="./js/api.js"></script>

<script>


document.querySelector(".reg-form").addEventListener("submit", function(event){
	// 阻止表单 提交 
	event.preventDefault() ;

	if (this.name.value === "") {
		layer.tips("姓名不允许为空", this.name);
		return ;
	}

	if (this.tel.value === "") {
		layer.tips("手机号不允许为空", this.tel);
		return ;
	}

	if (!/^1[3-9]\d{9}$/.test(this.tel.value)) {
		layer.tips("手机号格式不正确", this.tel);
		return ;
	}

	if (this.className.value === "") {
		layer.tips("班级名不允许为空", this.className);
		return ;
	}

	if (this.password.value === "") {
		layer.tips("密码不允许为空", this.password);
		return ;
	}
	let confirmPassword = this.querySelector("#confrim")

	if (confirmPassword.value !== this.password.value) {
		layer.tips("两次输入的密码不一致", confirmPassword);
		return ;
	}

	// 获取 选中的 角色
	let role = this.querySelector("[type=radio]:checked").value ;

	// 如果 数据 没有任何问题 、调用接口 、完成用户的注册 
	let data = {
		"name": this.name.value,
		"tel":  this.tel.value , 
		"password":  this.password.value,
		"className": this.className.value,
		"role": role 
	}

	// 调用接口、完成注册 
	API.register(data).then(response => {
		// 获取 接口返回的结果 
		if (response.status) {
			// 接口调用成功 、跳转到 登录页面 
			location.href = "./login.html" ;
		}else {
			// 提示 失败的原因 
			layer.msg(response.error.invalid) ;
		}
	})

})


</script>




</body>
</html>
